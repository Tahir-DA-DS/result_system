# Render Blueprint for the backend. The frontend goes on Vercel (see DEPLOY.md).
services:
  - type: web
    name: bright-hills-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true       # Render creates a long random secret for you
      - key: MONGODB_URI
        sync: false               # you enter these when you deploy
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
